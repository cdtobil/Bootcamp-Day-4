<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Day 4: Charts with matplotlib</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#2B2B2B;--pn:#3C3F41;--ed:#232425;--ln:#4E5254;--ink:#BBBBBB;--hi:#fff;--or:#CC7832;--gr:#6A8759;--bl:#6897BB;--ye:#FFC66D;--pu:#9876AA;--gy:#808080;--sel:#214283;--g1:#21D789;--g2:#FCF84A;--g3:#07C3F2;--red:#FF6B68;
--f:'Inter',system-ui,sans-serif;--m:'JetBrains Mono',ui-monospace,Consolas,monospace;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit;margin:0}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--f);overflow:hidden;display:grid;grid-template:"top top" 46px "tree stage" 1fr "st st" 30px/265px 1fr}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--g3);outline-offset:2px}
#top{grid-area:top;background:var(--pn);border-bottom:1px solid #2B2B2B;display:flex;align-items:center;gap:12px;padding:0 12px}
.mk{width:26px;height:26px;border-radius:5px;background:linear-gradient(135deg,var(--g1),var(--g2) 60%,var(--g3));position:relative;flex:none}
.mk::after{content:"PC";position:absolute;left:3px;top:3px;width:16px;height:16px;background:#000;color:#fff;font:800 7px/16px var(--f);text-align:center}
.proj{font-weight:600;color:var(--hi)}
.tabf{margin-left:10px;padding:.35em .9em;background:var(--bg);border-bottom:2px solid var(--g1);color:var(--hi);font:.9rem var(--m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
#top .nb{padding:.35em 1em;border-radius:6px;background:#4C5052;color:var(--hi);font-weight:600;font-size:.9rem}
#top .nb:hover{background:var(--sel)}
#top .nb.go{background:#365880}
#menu{font-size:1.3rem;color:var(--hi);padding:0 .3em}
@media(min-width:801px){body.hide{grid-template:"top top" 46px "stage stage" 1fr "st st" 30px/0 1fr}body.hide #tree{display:none}}
#tree{grid-area:tree;background:var(--pn);overflow-y:auto;border-right:1px solid #2B2B2B;padding:8px 0;font-size:.92rem}
.fd{padding:.4em .8em;color:var(--hi);font-weight:600;margin-top:4px}
.fd::before{content:"▾ ";color:var(--or)}
.fl{display:block;width:100%;text-align:left;padding:.3em .8em .3em 2.2em;font-family:var(--m);font-size:.85rem;color:var(--ink)}
.fl::before{content:"■ ";color:var(--ye);font-size:.7em}
.fl:hover{background:#4C5052}
.fl.on{background:var(--sel);color:var(--hi)}
#stage{grid-area:stage;position:relative;overflow:hidden}
.slide{position:absolute;inset:0;display:none;flex-direction:column;padding:clamp(18px,3.5vw,48px) clamp(18px,5vw,80px);overflow-y:auto}
.slide.on{display:flex;animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.in{margin:auto 0;display:grid;gap:1.1rem;width:100%;max-width:1100px}
h1{font-size:clamp(2.6rem,7.5vw,5.6rem);line-height:1;font-weight:800;letter-spacing:-.03em;color:var(--hi)}
h1 span{background:linear-gradient(90deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:clamp(1.7rem,3.6vw,2.8rem);line-height:1.1;font-weight:800;letter-spacing:-.02em;color:var(--hi)}
h2::after{content:"";display:block;width:64px;height:4px;border-radius:2px;margin-top:.5rem;background:linear-gradient(90deg,var(--g1),var(--g2))}
p,li{font-size:clamp(1rem,1.7vw,1.3rem);line-height:1.55;max-width:64ch}
.lead{font-size:clamp(1.1rem,2vw,1.6rem);color:var(--ink)}
.hint{font-size:.95rem;color:var(--gy)}
b{color:var(--hi)}
code{font-family:var(--m);background:#3B3B3B;color:var(--ye);padding:.05em .4em;border-radius:4px;font-size:.88em}
.logo{width:112px;height:112px;border-radius:16px;background:linear-gradient(135deg,var(--g1),var(--g2) 60%,var(--g3));position:relative}
.logo b{position:absolute;left:18px;top:18px;width:76px;height:76px;background:#000;color:#fff;font:800 1.7rem/1 var(--f);padding:10px 0 0 10px}
.logo i{position:absolute;left:28px;bottom:26px;width:34px;height:5px;background:#fff}
.big{justify-self:start;padding:.7em 1.6em;border-radius:8px;background:linear-gradient(90deg,var(--g1),var(--g2));color:#1b1b1b;font-weight:800;font-size:1.1rem}
.big:hover{filter:brightness(1.1)}
.cols{display:grid;grid-template-columns:1.3fr 1fr;gap:clamp(16px,3vw,36px);align-items:start}
.bul{padding-left:1.2em;display:grid;gap:.5em}
.win{background:var(--bg);border:1px solid var(--ln);border-radius:8px;overflow:hidden;font:clamp(.82rem,1.4vw,1.12rem)/1.6 var(--m);box-shadow:0 10px 30px #0006}
.wt{display:flex;align-items:center;justify-content:space-between;background:var(--pn);padding:0 8px 0 0;font-size:.85em}
.tab{padding:.45em 1em;background:var(--bg);border-bottom:2px solid var(--g1);color:var(--hi)}
.run{padding:.25em .9em;border-radius:5px;background:#365E3A;color:#9fe6a0;font:600 .85em var(--f)}
.run:hover{background:#3f7a45}
.ed{display:grid;grid-template-columns:auto 1fr}
.ed pre{font:inherit;padding:.8em 0;margin:0}
.gut{background:#313335;color:#606366;text-align:right;padding:.8em .8em!important;user-select:none}
.src{padding:.8em 1.2em!important;overflow-x:auto;color:#A9B7C6}
i{font-style:normal}i.c{color:var(--gy);font-style:italic}i.s{color:var(--gr)}i.k{color:var(--or)}i.n{color:var(--bl)}i.b{color:#8888C6}i.f{color:var(--ye)}
.out{display:none;background:var(--ed);border-top:1px solid var(--ln);padding:.7em 1.2em;color:#A9B7C6;white-space:pre-wrap;min-height:3em}
.out.on{display:block}.out .g{color:var(--gy)}.out .er{color:var(--red)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.card{text-align:left;background:var(--pn);border:1px solid var(--ln);border-top:4px solid var(--g3);border-radius:10px;padding:1em 1.2em;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-3px);border-color:var(--g1)}
.card.star{border-top-color:var(--g1)}
.card h3{color:var(--hi);font-size:1.25rem;margin-bottom:.3em}
.card p{font-size:1rem}
.card .d{display:none;margin-top:.7em;padding-top:.7em;border-top:1px dashed var(--ln);color:var(--ye);font-size:1rem;line-height:1.5}
.card.open .d{display:block}
.chk{list-style:none;display:grid;gap:.5em;padding:0}
.chk li{display:flex;gap:.8em;align-items:flex-start;cursor:pointer;padding:.6em .9em;background:var(--pn);border:1px solid var(--ln);border-radius:8px;max-width:none;color:var(--hi)}
.chk li:hover{border-color:var(--g3)}
.bx{flex:none;width:1.4em;height:1.4em;border:2px solid var(--gy);border-radius:5px;margin-top:.1em;display:grid;place-items:center;font-size:.8em;color:transparent}
.chk li.done{color:var(--gy)}.chk li.done .bx{background:var(--g1);border-color:var(--g1);color:#000;font-weight:800}
.chk li.done span:last-child{text-decoration:line-through}
.prog{height:8px;background:var(--pn);border-radius:6px;overflow:hidden}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g1),var(--g2));transition:width .3s}
.pt{font-size:.95rem;color:var(--gy)}.all .pt{color:var(--g1);font-weight:600}
.tip{background:#3A372A;border-left:4px solid var(--ye);padding:.7em 1em;border-radius:0 8px 8px 0;color:var(--hi);max-width:64ch}
.repl{background:var(--ed);border:1px solid var(--ln);border-radius:8px;font:clamp(.85rem,1.5vw,1.1rem)/1.6 var(--m);padding:.8em 1.1em}
.repl .log{min-height:7em;max-height:34vh;overflow-y:auto;white-space:pre-wrap;color:#A9B7C6}
.repl .log .u{color:var(--hi)}.repl .log .er{color:var(--red)}.repl .log .g{color:var(--gy)}
.inl{display:flex;gap:.6em;color:var(--g1);margin-top:.4em}
.inl input{flex:1;background:none;border:0;color:var(--hi);font:inherit;outline-offset:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{font:.9rem var(--m);padding:.4em .8em;border-radius:6px;background:var(--pn);border:1px solid var(--ln);color:var(--ye)}
.chips button:hover{border-color:var(--g1)}
.sl{width:100%;accent-color:var(--g1)}
.ln{display:block;padding-left:.3em;border-left:3px solid transparent}.ln.on{background:#214283;border-left-color:var(--g1)}
.num{font:800 3rem var(--f);color:var(--hi)}
.res{font:clamp(1rem,1.8vw,1.4rem) var(--m);color:var(--g1)}
.tabs{display:flex;gap:8px}.tb{padding:.5em 1.2em;border-radius:8px 8px 0 0;background:var(--pn);color:var(--ink);font-weight:600}.tb.on{background:var(--sel);color:var(--hi)}
.pane{display:none;gap:1rem}.pane.on{display:grid}
.mock{display:grid;grid-template:"p e e" 1fr "p r t" .7fr/.7fr 1fr 1fr;gap:6px;height:min(46vh,340px)}
.rg{background:var(--pn);border:2px solid var(--ln);border-radius:6px;text-align:left;padding:.5em .8em;font:.8rem/1.5 var(--m);color:var(--ink);overflow:hidden}
.rg:hover,.rg.on{border-color:var(--g1);box-shadow:0 0 0 2px #21D78955}
.rg strong{display:block;color:var(--g3);font:700 .75rem var(--f);margin-bottom:.3em}
.info:empty{display:none}.info{min-height:3.6em;padding:.8em 1em;background:var(--pn);border-radius:8px;color:var(--hi);border-left:4px solid var(--g1)}
.q{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:1em 1.2em}
.qt{color:var(--hi);font-weight:600;margin-bottom:.6em}
.ops{display:flex;flex-wrap:wrap;gap:8px}
.op{padding:.45em 1em;border-radius:6px;background:var(--bg);border:2px solid var(--ln);font:.95rem var(--m);color:var(--ink)}
.op:hover{border-color:var(--g3)}.op.ok{border-color:var(--g1);color:var(--g1)}.op.bad{border-color:var(--red);color:var(--red)}
.ex{display:none;margin-top:.6em;color:var(--ye);font-size:1rem}.ex.on{display:block}
.score{font:800 clamp(3rem,10vw,6rem)/1 var(--f);background:linear-gradient(90deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}
#st{grid-area:st;background:var(--pn);border-top:1px solid #2B2B2B;display:flex;align-items:center;gap:16px;padding:0 12px;font-size:.8rem;color:var(--ink);position:relative}
#st i{position:absolute;left:0;top:-2px;height:2px;width:0;background:linear-gradient(90deg,var(--g1),var(--g2));transition:width .3s}
#st .r{margin-left:auto}
.fc{display:flex;flex-direction:column;align-items:center}
.fb{padding:.55em 1.2em;border:2px solid var(--g3);border-radius:8px;background:var(--pn);color:var(--hi);font:clamp(.85rem,1.5vw,1.05rem) var(--m);text-align:center}
.fb.t{border-radius:999px;border-color:var(--g1)}.fb.d{border-color:var(--ye);color:var(--ye)}
.fa{color:var(--gy);line-height:1.3;font-size:1.05rem}
.br{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;width:100%;max-width:440px}
.bc{display:flex;flex-direction:column;align-items:center}
/* ===== visual polish ===== */
*{scrollbar-width:thin;scrollbar-color:#555 transparent}
#stage::before,#stage::after{content:"";position:absolute;pointer-events:none;z-index:0}
#stage::before{inset:0;background:radial-gradient(520px circle at var(--mx,70%) var(--my,20%),#21D78916,transparent 60%),radial-gradient(700px circle at 8% 95%,#07C3F212,transparent 60%),radial-gradient(600px circle at 95% 85%,#FCF84A0d,transparent 60%),radial-gradient(#ffffff0b 1px,transparent 1px) 0 0/26px 26px}
#stage::after{width:440px;height:440px;right:-140px;top:-140px;border-radius:50%;background:radial-gradient(circle,#21D78930,transparent 65%);filter:blur(24px);animation:fl 14s ease-in-out infinite alternate}
@keyframes fl{to{transform:translate(-200px,160px) scale(1.25)}}
.slide{z-index:1}
.slide.on{animation:sl .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes sl{from{opacity:0;transform:translateX(var(--dx,30px))}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.92)}}
@keyframes pp{50%{transform:scale(1.3)}}
@keyframes sk{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes sh{to{background-position:300% 0}}
@keyframes fy{50%{transform:translateY(-10px) rotate(-2deg)}}
@keyframes gl{from{box-shadow:0 0 25px #21D78944}to{box-shadow:0 0 60px #07C3F288}}
@keyframes sw{to{transform:translateX(120%)}}
@keyframes gw{from{width:0}}
.slide.on .in>*{animation:rise .6s cubic-bezier(.2,.8,.2,1) backwards}
.slide.on .in>.cards{animation:none}
.slide.on .card,.slide.on .fc>*{animation:pop .5s cubic-bezier(.2,.9,.3,1.2) backwards}
.slide.on .bul>li,.slide.on .chk>li{animation:rise .5s backwards}
.slide.on .in>.logo{animation:rise .6s backwards,fy 5s ease-in-out .6s infinite,gl 3s ease-in-out infinite alternate}
.kick{display:inline-block;justify-self:start;font:600 .72rem var(--m);letter-spacing:.14em;text-transform:uppercase;color:var(--g1);background:#21D7891a;border:1px solid #21D78955;padding:.25em .9em;border-radius:999px}
.slide:first-child .kick{display:none}
h1 span{background:linear-gradient(90deg,var(--g1),var(--g2),var(--g3),var(--g1)) 0 0/300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 6s linear infinite}
h2::after{height:4px;box-shadow:0 0 14px #21D78999;animation:gw .8s .25s backwards}
.big{position:relative;overflow:hidden;box-shadow:0 8px 30px #21D78955;transition:transform .15s}
.big::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,#ffffff66 50%,transparent 70%);transform:translateX(-120%);animation:sw 3s infinite}
.big:hover{transform:translateY(-2px)}
#top{background:linear-gradient(180deg,#46494c,var(--pn));box-shadow:0 2px 12px #0006;z-index:4}
.mk{box-shadow:0 0 14px #21D78977}
#top .nb{transition:.15s}#top .nb.go{background:linear-gradient(90deg,#2d6b9a,#365880);box-shadow:0 0 0 1px #07C3F255}
#top .nb:hover{box-shadow:0 0 16px #07C3F277;transform:translateY(-1px)}
.fd{font:700 .7rem var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--gy);margin-top:10px}
.fl{border-left:3px solid transparent;padding-left:calc(2.2em - 3px);transition:background .15s}
.fl.on{border-left-color:var(--g1);background:linear-gradient(90deg,#214283cc,transparent)}
#st i{height:3px;box-shadow:0 0 10px var(--g1)}
.card{background:linear-gradient(160deg,#464b4e,#35393b);border:1px solid #ffffff14;border-top:4px solid var(--c,var(--g3));border-radius:14px;box-shadow:0 8px 22px #0004;position:relative;overflow:hidden}
.card:nth-child(4n+1){--c:var(--g1)}.card:nth-child(4n+2){--c:var(--g3)}.card:nth-child(4n+3){--c:var(--g2)}.card:nth-child(4n+4){--c:var(--pu)}
.card.star{--c:var(--g1)}
.card::after{content:"";position:absolute;right:-30px;top:-30px;width:100px;height:100px;border-radius:50%;background:radial-gradient(circle,var(--c),transparent 70%);opacity:.16;transition:opacity .2s}
.card:hover{border-color:var(--c);box-shadow:0 14px 34px #0007,0 0 22px color-mix(in srgb,var(--c) 30%,transparent)}
.card:hover::after,.card.open::after{opacity:.4}
.card.star::before{content:"★ KEY";position:absolute;right:.8em;top:.8em;font:700 .62rem var(--m);color:#1b1b1b;background:var(--g1);padding:.15em .55em;border-radius:4px}
.win{border-color:#ffffff22;box-shadow:0 18px 50px #000a,0 0 40px #21D78912}
.wt{background:linear-gradient(180deg,#46494c,var(--pn))}
.wt::before{content:"";width:10px;height:10px;border-radius:50%;background:#FF5F57;box-shadow:16px 0 #FEBC2E,32px 0 #28C840;margin:0 54px 0 14px;flex:none}
.wt .tab{margin-right:auto}
.run{background:linear-gradient(90deg,#2f7d45,#3f9a55);color:#eaffea;box-shadow:0 0 14px #21D78944;transition:.15s}
.run:hover{box-shadow:0 0 22px #21D78999;transform:translateY(-1px)}
.out.on{border-left:3px solid var(--g1)}.out div{animation:rise .25s backwards}
.chk li{transition:.2s}
.chk li.done{border-color:#21D78966;background:linear-gradient(90deg,#21D78914,var(--pn))}
.chk li.done .bx{animation:pp .3s}
.prog{box-shadow:inset 0 0 0 1px #ffffff12}.prog i{box-shadow:0 0 10px var(--g1)}
.tip{background:linear-gradient(90deg,#FFC66D26,#3A372A 70%);box-shadow:0 6px 18px #0004}
.q{border-left:4px solid var(--g3);box-shadow:0 6px 18px #0003}
.op{transition:.15s}.op.ok{background:#21D7891f;animation:pp .35s}.op.bad{background:#FF6B681f;animation:sk .35s}
.info{box-shadow:0 6px 18px #0004}
.rg{transition:.15s}.rg:hover,.rg.on{transform:translateY(-2px)}
.fb{box-shadow:0 4px 14px #0005;transition:.2s}.fb:hover{transform:scale(1.04);border-color:var(--g1)}
.fb.d{background:#3d3a2a;box-shadow:0 0 18px #FFC66D33}
.fa{color:var(--g3)}
.num{background:linear-gradient(90deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}
.res{text-shadow:0 0 16px #21D78977}
@media(max-width:800px){
body{grid-template:"top" 46px "stage" 1fr "st" 30px/1fr}
#menu{display:block}.proj,#st .r{display:none}
#tree{position:fixed;top:calc(46px + env(safe-area-inset-top,0px));bottom:30px;width:265px;z-index:5;transform:translateX(-100%);transition:transform .25s}
body.menu #tree{transform:none}
.cols{grid-template-columns:1fr}
.mock{height:auto;grid-template:"p" "e" "r" "t"/1fr}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.xl{border-collapse:collapse;font:clamp(.8rem,1.4vw,1rem) var(--m);width:100%}.xl td,.xl th{border:1px solid #4E5254;padding:.35em .7em;color:var(--hi);text-align:left}.xl th{background:#1D7A4B;text-align:center}.xl td:first-child{background:#313335;color:#808080;text-align:center}</style><style>.chartbox{display:grid;place-items:center;min-height:150px;border:2px dashed #4E5254;border-radius:8px;color:#808080;padding:6px}.chartbox img{display:none;width:100%;height:auto;border-radius:6px;background:#fff}.chartbox.on{border:0;padding:0}.chartbox.on img{display:block}.chartbox.on .ph{display:none}</style></head><body>
<header id="top">
<button id="menu" aria-label="Show or hide files (S)" title="Show or hide files (S)">≡</button><span class="mk"></span><span class="proj">bootcamp</span>
<span class="tabf" id="tabf">welcome.py</span><span class="sp"></span>
<button class="nb" data-a="prev">Back</button><button class="nb go" data-a="next">Next ▶</button>
</header>
<nav id="tree" aria-label="Slides"></nav>
<main id="stage"></main>
<footer id="st"><i id="pg"></i><span id="path"></span><span class="r" id="pos"></span></footer>

<script>
const $=(q,e=document)=>e.querySelector(q),$$=(q,e=document)=>[...e.querySelectorAll(q)];
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const RX=/(#.*)|(f?"[^"\n]*"|f?'[^'\n]*')|\b(def|return|if|elif|else|for|in|import|from|as|True|False|None|and|or|not|while)\b|\b(print|len|sum|max|min|range|type|str|int|float|input)(?=\()|\b(\d+\.?\d*)\b/g;
const hl=s=>esc(s).replace(RX,(m,c,st,k,b)=>c?`<i class=c>${m}</i>`:st?`<i class=s>${m}</i>`:k?`<i class=k>${m}</i>`:b?`<i class=b>${m}</i>`:`<i class=n>${m}</i>`).replace(/(<i class=k>def<\/i> )(\w+)/g,'$1<i class=f>$2</i>');
const nums=n=>Array.from({length:n},(_,i)=>i+1).join('\n');
function win(code,out,f,sh){return `<div class=win data-out='${JSON.stringify(out).replace(/'/g,'&#39;')}' data-f="${sh?'Terminal':f}"><div class=wt><span class=tab>${sh?'Terminal':f}</span>${out===null?'':`<button class=run data-a=run>▶ ${sh?'Enter':'Run'}</button>`}</div><div class=ed><pre class=gut>${nums(code.split('\n').length)}</pre><pre class=src>${sh?esc(code):hl(code)}</pre></div><div class=out></div></div>`}
const cd=(h,code,out,f,bul,sh)=>`<h2>${h}</h2><div class=cols>${win(code,out,f,sh)}<ul class=bul>${bul.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
const cards=(h,it,t)=>`<h2>${h}</h2><div class=cards>${it.map(c=>`<button class="card${c.s?' star':''}" data-a=card><h3>${c.h}</h3><p>${c.p}</p><div class=d>${c.d}</div></button>`).join('')}</div>`;
const steps=(h,st,tip)=>`<h2>${h}</h2><div class=cw><ul class=chk>${st.map(s=>`<li data-a=chk><span class=bx>✓</span><span>${s}</span></li>`).join('')}</ul><div class=prog><i></i></div><p class=pt>0 of ${st.length} done</p></div>${tip?`<p class=tip>${tip}</p>`:''}`;
const quiz=(h,qs)=>`<h2>${h}</h2>${qs.map(q=>`<div class=q data-a-ans=${q.a}><p class=qt>${q.q}</p><div class=ops>${q.o.map((o,i)=>`<button class=op data-a=opt data-i=${i}>${o}</button>`).join('')}</div><p class=ex>${q.e}</p></div>`).join('')}`;
const IFL=['score = 65','if score >= 70:','    print("Distinction")','elif score >= 50:','    print("Pass")','else:','    print("Retake")'],IFB=[-1,0,0,1,1,2,2];
const EXC=`scores = [70, 85, 92, 60, 48]
for s in scores:
    print(s)

def average(numbers):
    return sum(numbers) / len(numbers)

avg = average(scores)
print("Average:", avg)
if avg >= 50:
    print("Pass")
else:
    print("Retake")`;

{p:"Part 2 · Charts from your data",f:"good_charts.py",h:cards("A good chart checklist",[{"h": "Right chart", "p": "Line, bar or pie?", "d": "Time means line. Groups mean bar. Parts of a whole mean pie."}, {"h": "Title", "p": "Say what it shows.", "d": "\"Monthly sales\" is better than no title."}, {"h": "Labels", "p": "Name both axes.", "d": "Add units, such as GHS or mm."}, {"h": "Keep it simple", "p": "Few colours, few slices.", "d": "If you have to explain the chart for a long time, simplify it."}])},
{p:"Practice",f:"quiz_day4.py",h:quiz("Quick quiz: charts",[{"q": "Which chart is best for showing change over time?", "o": ["Pie chart", "Line chart", "Text box", "Map"], "a": 1, "e": "A line joins points in order, so it shows change over time."}, {"q": "Which line draws a bar chart?", "o": ["plt.bar(x, y)", "plt.bars(x, y)", "plt.chart(bar)", "plt.draw(x, y)"], "a": 0, "e": "plt.bar() draws one bar per name."}, {"q": "What does <code>plt.show()</code> do?", "o": ["Saves the chart", "Opens the chart window", "Deletes the chart", "Adds a title"], "a": 1, "e": "show() displays the chart you have built."}, {"q": "Which line adds a title?", "o": ["plt.name(\"Sales\")", "plt.header(\"Sales\")", "plt.title(\"Sales\")", "plt.top(\"Sales\")"], "a": 2, "e": "plt.title() sets the chart title."}, {"q": "To save a chart as a picture, what goes <b>before</b> <code>plt.show()</code>?", "o": ["plt.savefig(\"chart.png\")", "plt.save()", "Nothing, it saves itself", "plt.image()"], "a": 0, "e": "savefig() must come before show()."}])},
{p:"Practice",f:"exercise_fruit.py",h:`<h2>Exercise 1: fruit sales</h2><div class=cw><ul class=chk>${["Make two lists: <code>fruits</code> (Mango, Pawpaw, Orange, Banana) and <code>kg</code> (40, 25, 60, 35).", "Draw a bar chart of kg for each fruit.", "Add the title \"Fruit sold this week\".", "Label the up-and-down axis \"Kilograms\".", "Change the bar colour."].map(s=>`<li data-a=chk><span class=bx>✓</span><span>${s}</span></li>`).join('')}</ul><div class=prog><i></i></div><p class=pt>Try it yourself first. 0 of 5 done</p></div><button class=big data-a=sol>Show solution</button><div class=sol style="display:none"><div class=cols>${win("import matplotlib.pyplot as plt\n\nfruits = [\"Mango\", \"Pawpaw\", \"Orange\", \"Banana\"]\nkg = [40, 25, 60, 35]\n\nplt.bar(fruits, kg, color=\"orange\")\nplt.title(\"Fruit sold this week\")\nplt.ylabel(\"Kilograms\")\nplt.show()",["A chart window opens"],'exercise_fruit.py')}<div class=chartbox><span class=ph>Press Run to draw the chart</span><img alt="Fruit sold this week" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAdUAAAFPCAYAAAAbRFTSAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjEwLjgsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvwVt1zgAAAAlwSFlzAAAPYQAAD2EBqD+naQAAMyhJREFUeJzt3Xtcjvf/B/DXXTre1Z1CByqpKKcQEqWQpZlvJkOzr2bGTDMK29rmOJbN5LChzbbCmK1NGHOYEHMWNjNajjXpMFZ3ovTV5/eHh+u3ex3U7dLd4fV8PO7Ho+tznd7X53bfL9fxVgghBIiIiOix6em6ACIiooaCoUpERCQThioREZFMGKpEREQyYagSERHJhKFKREQkE4YqERGRTBiqREREMmGoEhERyYShSlRDAQEBCAgI0HUZAIA5c+ZAoVBUa1qFQoE5c+Zova6AgAB07NjxkdNdvXoVCoUCCQkJWq+rrnnYz3/99ZeuS6E6jqFKDUZCQgIUCkWFr7feeuuJrTcrKwtz5szBmTNnntg6aktD2hYiXWii6wKI5DZv3jw4OztrtFVnD6u6du/erTGclZWFuXPnonXr1ujSpYts69EFObbFyckJd+/ehYGBgbzFEdUDDFVqcIKDg9G9e/dqTVtcXAxDQ0Po6VX/oI2hoaG2pTUKCoUCxsbGui6DSCd4+Jcajf3790OhUGDjxo1499130bJlS5iamkKtVld6bvLhIeWrV69Kbf88p7p//3706NEDADB27FjpcHNV5xMLCwsxdepUtG7dGkZGRmjRogUGDhyIU6dOaUyXmJgILy8vmJiYoFmzZnjhhRdw/fr1R25nSUkJIiMj0bx5c5ibm+M///kP/vzzz2r1T3W25ffff0e/fv1gamqKli1b4sMPP9QYX9E51ezsbIwdOxatWrWCkZER7OzsEBISotGv/7Z161
